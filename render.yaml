services:
  - type: web
    name: hutaotiktok-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile --ignore-scripts && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: hutaotiktok-db
          property: connectionString

databases:
  - name: hutaotiktok-db
    plan: free
    databaseName: hutaotiktok
    user: hutaotiktok