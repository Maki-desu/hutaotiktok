services:
  - type: web
    name: hutaotiktok-api
    runtime: node
    plan: free
    buildCommand: chmod +x yt-dlp && pnpm install --frozen-lockfile --ignore-scripts && pnpm --filter @workspace/api-server run build
    preDeployCommand: pnpm --filter @workspace/db run push
    startCommand: pnpm --filter @workspace/api-server run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - fromGroup: taotik

databases:
  - name: hutaotiktok-db
    plan: free
    databaseName: hutaotiktok
    user: hutaotiktok
